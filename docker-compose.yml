services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sejenak-web
    restart: always
    ports:
      - "8089:80"
    volumes:
      # Persist storage directory for uploads/logs
      - ./storage:/var/www/html/storage
      # Mount environment file to prevent losing settings
      - ./.env:/var/www/html/.env
